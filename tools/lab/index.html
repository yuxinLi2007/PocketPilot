<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketPilot Lab · 开发监测站</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --border: #e5e7eb;
    --text: #1f2937; --muted: #6b7280;
    --blue: #2563eb; --green: #16a34a; --red: #dc2626;
    --orange: #d97706; --brown: #b45309; --gray: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; }
  header { background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 18px; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); margin-right: 5px; }
  main { max-width: 1200px; margin: 20px auto; padding: 0 24px;
    display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; }
  .card h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .kpi .num { font-size: 28px; font-weight: 700; }
  .kpi .label { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .kpi.ok .num { color: var(--green); } .kpi.bad .num { color: var(--red); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }
  .bar-row { display: grid; grid-template-columns: 150px 1fr 90px; gap: 8px;
    align-items: center; margin: 6px 0; font-size: 13px; }
  .bar-track { background: #eef0f3; border-radius: 4px; height: 18px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; min-width: 2px; }
  .bar-num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px;
    border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
  tr:hover td { background: #f8fafc; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px;
    font-size: 12px; color: #fff; white-space: nowrap; }
  .mono { font-family: Consolas, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  select, input[type=search] { padding: 5px 8px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; background: #fff; }
  .selftest { display: flex; gap: 16px; flex-wrap: wrap; }
  .st-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; min-width: 170px; }
  .st-item .t { font-weight: 600; margin-bottom: 4px; }
  .st-item .p { color: var(--green); font-weight: 700; }
  .st-item .f { color: var(--red); font-weight: 700; }
  .st-item .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  .lat-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>PocketPilot Lab</h1>
  <span class="sub"><span class="dot"></span>开发监测站 · 数据每 3 秒自动刷新</span>
  <span class="sub" id="meta"></span>
</header>
<main>

  <div class="grid4" id="kpis"></div>

  <div class="two-col">
    <div class="card"><h2>命令类型分布（正常命令，不含注入测试）</h2><div id="cmd-bars"></div></div>
    <div class="card"><h2>每条命令的最终结果（命令级）</h2><div id="status-bars"></div></div>
  </div>

  <div class="two-col">
    <div class="card"><h2>各命令执行耗时（手机收到命令 → 动作完成）</h2>
      <div id="latency"></div>
      <div class="lat-note" id="lat-note"></div></div>
    <div class="card"><h2>测试与配置 · 自测摘要</h2><div class="selftest" id="selftests"></div></div>
  </div>

  <div class="card">
    <h2>任务执行记录 <span class="muted" id="record-count"></span></h2>
    <div class="filters">
      <select id="f-cmd"><option value="">全部命令</option></select>
      <select id="f-status"><option value="">全部状态</option></select>
      <input type="search" id="f-q" placeholder="搜索 command_id / 详情 / 错误代码…">
    </div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th>时间</th><th>命令</th><th>状态</th><th>耗时</th>
        <th>来源 / 设备</th><th>错误代码</th><th>详情</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
  </div>

</main>
<script>
const STATUS_COLOR = {
  RECEIVED: "#6b7280", EXECUTED_UNCONFIRMED: "#2563eb", CONFIRMED: "#16a34a",
  PERMISSION_REQUIRED: "#b45309", NOT_INSTALLED: "#d97706", REJECTED: "#dc2626",
};
const CMD_LABEL = {
  COMMAND_OPEN_MAP: "打开地图", COMMAND_OPEN_WECHAT: "打开微信",
  COMMAND_BACK: "返回上一页", PROTOCOL_ERROR: "协议错误",
};
let DATA = null;

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function fmtTime(ms) {
  if (!ms) return "—";
  const d = new Date(ms);
  const p = n => String(n).padStart(2, "0");
  return `${d.getMonth()+1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function bars(el, items, colors) {
  const max = Math.max(1, ...items.map(i => i.count));
  el.innerHTML = items.map(i => `
    <div class="bar-row">
      <div>${esc(i.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${i.count/max*100}%;background:${colors[i.key] || "#2563eb"}"></div></div>
      <div class="bar-num">${i.count}</div>
    </div>`).join("");
}
function renderKpis(c) {
  const env = c.env_detail || {};
  const envText = [
    env.NOT_INSTALLED ? `应用未安装 ${env.NOT_INSTALLED}` : "",
    env.PERMISSION_REQUIRED ? `无障碍未授权 ${env.PERMISSION_REQUIRED}` : "",
  ].filter(Boolean).join(" · ") || "无";
  document.getElementById("kpis").innerHTML = `
    <div class="card kpi"><div class="num">${c.total}</div><div class="label">命令总数（按命令去重，非记录数）</div></div>
    <div class="card kpi ok"><div class="num">${c.success_rate}%</div><div class="label">执行成功率（${c.executed} 成功 · ${c.failed} 失败；环境阻塞与注入测试不计入）</div></div>
    <div class="card kpi"><div class="num" style="color:${c.env_blocked ? "#d97706" : "inherit"}">${c.env_blocked}</div><div class="label">被环境阻塞（${esc(envText)}）——不是执行失败</div></div>
    <div class="card kpi ok"><div class="num">${c.guard.blocked}/${c.guard.total + (c.injected || 0)}</div><div class="label">异常注入测试全部拦截（非法帧 + 缺参/超长/重复）</div></div>`;
}
function renderSelftests(st) {
  const el = document.getElementById("selftests");
  const keys = Object.keys(st);
  if (!keys.length) { el.innerHTML = '<div class="empty">未找到自测日志</div>'; return; }
  el.innerHTML = keys.map(k => {
    const t = st[k];
    const meta = [t.device, t.serial, t.time].filter(Boolean).join(" · ");
    return `<div class="st-item">
      <div class="t">${esc(t.name)}</div>
      <div><span class="p">PASS ${t.passed}</span>　<span class="${t.failed ? "f" : "muted"}">FAIL ${t.failed}</span></div>
      ${meta ? `<div class="meta">${esc(meta)}</div>` : ""}
    </div>`;
  }).join("");
}
function renderLatency(lat, total) {
  const el = document.getElementById("latency");
  const cmds = Object.keys(lat);
  const measured = Object.values(lat).reduce((a, s) => a + s.count, 0);
  document.getElementById("lat-note").textContent =
    measured === 0 ? "当前数据集中无正耗时记录（模拟链路耗时多为 0），真机接入后自动展示。"
                   : `口径：手机收到命令 → 动作完成（不含按键和语音识别时间）。共 ${measured} 条含耗时记录。`;
  if (!cmds.length) { el.innerHTML = '<div class="empty">暂无耗时数据</div>'; return; }
  const PLAIN = {
    COMMAND_OPEN_WECHAT: "收到命令后瞬间完成，人感觉不到延迟。",
    COMMAND_OPEN_MAP: "收到命令后瞬间完成；最慢的一条是因为要调系统解析器选地图应用。",
    COMMAND_BACK: "比打开应用慢——返回走无障碍服务执行，测试时还包含长按手势的判定时间，属正常现象。",
  };
  el.innerHTML = cmds.map(c => {
    const s = lat[c];
    return `<div style="margin:10px 0;border-bottom:1px solid #f0f1f3;padding-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <b>${esc(CMD_LABEL[c] || c)}</b>
        <span class="mono" style="color:#7c3aed">平均 ${s.avg_ms} ms ｜ 最慢 ${s.max_ms} ms</span>
      </div>
      <div class="muted" style="font-size:12px;margin-top:3px">${PLAIN[c] || ""}（样本 ${s.count} 条，P95 ${s.p95_ms} ms）</div>
    </div>`;
  }).join("");
}
function renderTable() {
  if (!DATA) return;
  const fc = document.getElementById("f-cmd").value;
  const fs = document.getElementById("f-status").value;
  const q = document.getElementById("f-q").value.trim().toLowerCase();
  let rows = DATA.records;
  if (fc) rows = rows.filter(r => r.command === fc);
  if (fs) rows = rows.filter(r => r.status === fs);
  if (q) rows = rows.filter(r =>
    (r.command_id + r.detail + r.evidence + r.error_code).toLowerCase().includes(q));
  const shown = rows.slice(-300);
  document.getElementById("record-count").textContent =
    `（筛选 ${rows.length} 条，显示最近 ${shown.length} 条）`;
  document.getElementById("tbody").innerHTML = shown.map(r => `
    <tr>
      <td class="mono muted">${fmtTime(r.finished_at_ms)}</td>
      <td>${esc(CMD_LABEL[r.command] || r.command)}</td>
      <td><span class="tag" style="background:${STATUS_COLOR[r.status] || "#9ca3af"}">${esc(r.status_label || r.status)}</span></td>
      <td class="mono">${r.elapsed_ms > 0 ? r.elapsed_ms + " ms" : "—"}</td>
      <td class="muted">${esc(r.source)}</td>
      <td class="mono" style="color:${r.error_code ? "#dc2626" : "inherit"}">${esc(r.error_code) || "—"}</td>
      <td class="muted">${esc(r.detail)}</td>
    </tr>`).join("") || '<tr><td colspan="7" class="empty">无匹配记录</td></tr>';
}
const FINAL_LABEL = {
  CONFIRMED: "已确认（动作完成且结果核实）",
  EXECUTED_UNCONFIRMED: "已执行·未确认（动作已做，无法核实结果）",
  RECEIVED: "仅接收（未走完流程）",
  NOT_INSTALLED: "应用未安装",
  PERMISSION_REQUIRED: "权限未授权",
  REJECTED: "已拒绝",
};
function render() {
  if (!DATA) return;
  const s = DATA.summary, c = DATA.chains;
  document.getElementById("meta").textContent =
    `数据目录更新于 ${DATA.generated_at}`;
  renderKpis(c);
  bars(document.getElementById("cmd-bars"),
    Object.entries(s.by_command).filter(([k]) => k !== "PROTOCOL_ERROR")
      .sort((a,b) => b[1]-a[1])
      .map(([k,v]) => ({key:k, label:CMD_LABEL[k]||k, count:v})), {});
  bars(document.getElementById("status-bars"),
    Object.entries(c.by_final_status).sort((a,b) => b[1]-a[1])
      .map(([k,v]) => ({key:k, label:FINAL_LABEL[k]||k, count:v})), STATUS_COLOR);
  renderLatency(s.latency, s.total);
  renderSelftests(DATA.selftests);
  renderTable();
}
async function refresh() {
  try {
    const res = await fetch("/api/data");
    DATA = await res.json();
    const fc = document.getElementById("f-cmd"), fs = document.getElementById("f-status");
    if (fc.options.length <= 1)
      Object.keys(CMD_LABEL).forEach(k => fc.add(new Option(CMD_LABEL[k], k)));
    if (fs.options.length <= 1)
      Object.keys(STATUS_COLOR).forEach(k => fs.add(new Option(k, k)));
    render();
  } catch (e) { /* 服务未就绪时静默重试 */ }
}
for (const id of ["f-cmd", "f-status", "f-q"])
  document.getElementById(id).addEventListener("input", renderTable);
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
